name: Sincronizar historicos CARP

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar historicos CARP
        run: python sincronizar_carp.py

      - name: Guardar resultado en el repo
        run: |
          git config user.name 'carp-capture-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m 'Sincronizacion de historicos CARP'
          git push
